name: Build and publish Blubox client runtime

on:
  push:
    tags:
      - "client-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CCACHE_DIR: ${{ runner.temp }}/blubox-ccache
      CCACHE_MAXSIZE: 3G
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/blubox-ccache
          key: ${{ runner.os }}-ucrt64-ccache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ucrt64-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-ucrt64-ccache-client-v
            ${{ runner.os }}-ucrt64-ccache-

      - name: Configure client
        shell: msys2 {0}
        run: cmake -S client -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build client
        shell: msys2 {0}
        run: cmake --build build --target blubox_client --parallel 2

      - name: Build update launchers
        shell: msys2 {0}
        run: |
          cmake --build build --target blubox_launcher --parallel 2
          cmake --build build --target blubox_studio_launcher --parallel 2

      - name: Show compiler cache statistics
        if: always()
        shell: msys2 {0}
        run: ccache --show-stats

      - name: Compute client checksum
        id: checksum
        shell: pwsh
        run: |
          $exe = 'build/blubox_client.exe'
          if (-not (Test-Path $exe)) { throw "Client executable missing: $exe" }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          foreach ($item in @(@{Path='build/blubox_launcher.exe'; Name='launcher_sha256'}, @{Path='build/blubox_studio_launcher.exe'; Name='studio_launcher_sha256'})) {
            if (-not (Test-Path $item.Path)) { throw "Updater executable missing: $($item.Path)" }
            $hash = (Get-FileHash $item.Path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$($item.Name)=$hash" >> $env:GITHUB_OUTPUT
          }

      - name: Publish client runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring('client-v'.Length)
          Copy-Item 'build/blubox_client.exe' "$env:RUNNER_TEMP/BluboxClient.exe"
          Copy-Item 'build/blubox_launcher.exe' "$env:RUNNER_TEMP/blubox_launcher.exe"
          Copy-Item 'build/blubox_studio_launcher.exe' "$env:RUNNER_TEMP/blubox_studio_launcher.exe"
          gh release create "runtime-v$version" `
            "$env:RUNNER_TEMP/BluboxClient.exe" `
            "$env:RUNNER_TEMP/blubox_launcher.exe" `
            "$env:RUNNER_TEMP/blubox_studio_launcher.exe" `
            --repo '${{ github.repository }}' `
            --title "Blubox Client runtime v$version" `
            --notes 'Blubox Client executable downloaded by the launcher.' `
            --target '${{ github.sha }}' `
            --prerelease

      - name: Update client updater manifest
        uses: actions/github-script@v8
        env:
          CLIENT_SHA256: ${{ steps.checksum.outputs.sha256 }}
          CLIENT_LAUNCHER_SHA256: ${{ steps.checksum.outputs.launcher_sha256 }}
          STUDIO_LAUNCHER_SHA256: ${{ steps.checksum.outputs.studio_launcher_sha256 }}
        with:
          script: |
            const version = context.ref.replace('refs/tags/client-v', '');
            const { owner, repo } = context.repo;
            const path = 'version.json';
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            const manifest = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
            manifest.version = version;
            manifest.downloadUrl = `https://github.com/${owner}/${repo}/releases/download/runtime-v${version}/BluboxClient.exe`;
            manifest.sha256 = process.env.CLIENT_SHA256;
            manifest.launcherVersion = version;
            manifest.launcherDownloadUrl = `https://github.com/${owner}/${repo}/releases/download/runtime-v${version}/BluboxLauncher.exe`;
            manifest.launcherSha256 = process.env.CLIENT_LAUNCHER_SHA256;
            manifest.studioLauncherVersion = version;
            manifest.studioLauncherDownloadUrl = `https://github.com/${owner}/${repo}/releases/download/runtime-v${version}/BluboxStudioLauncher.exe`;
            manifest.studioLauncherSha256 = process.env.STUDIO_LAUNCHER_SHA256;
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main',
              message: `Publish Blubox Client manifest v${version}`,
              sha: current.data.sha,
              content: Buffer.from(`${JSON.stringify(manifest, null, 2)}\n`).toString('base64'),
            });
