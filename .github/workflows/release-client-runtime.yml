name: Build and publish Blubox client runtime

on:
  push:
    tags:
      - "client-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      - name: Configure client
        shell: msys2 {0}
        run: cmake -S client -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build client
        shell: msys2 {0}
        run: cmake --build build --target blubox_client --parallel 1

      - name: Compute client checksum
        id: checksum
        shell: pwsh
        run: |
          $exe = 'build/blubox_client.exe'
          if (-not (Test-Path $exe)) { throw "Client executable missing: $exe" }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$sha" >> $env:GITHUB_OUTPUT

      - name: Publish client runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring('client-v'.Length)
          Copy-Item 'build/blubox_client.exe' "$env:RUNNER_TEMP/BluboxClient.exe"
          gh release create "runtime-v$version" "$env:RUNNER_TEMP/BluboxClient.exe" `
            --repo '${{ github.repository }}' `
            --title "Blubox Client runtime v$version" `
            --notes 'Blubox Client executable downloaded by the launcher.' `
            --target '${{ github.sha }}' `
            --prerelease

      - name: Update client updater manifest
        uses: actions/github-script@v8
        env:
          CLIENT_SHA256: ${{ steps.checksum.outputs.sha256 }}
        with:
          script: |
            const version = context.ref.replace('refs/tags/client-v', '');
            const { owner, repo } = context.repo;
            const path = 'version.json';
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            const manifest = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
            manifest.version = version;
            manifest.downloadUrl = `https://github.com/${owner}/${repo}/releases/download/runtime-v${version}/BluboxClient.exe`;
            manifest.sha256 = process.env.CLIENT_SHA256;
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main',
              message: `Publish Blubox Client manifest v${version}`,
              sha: current.data.sha,
              content: Buffer.from(`${JSON.stringify(manifest, null, 2)}\n`).toString('base64'),
            });
