name: Build and publish Blubox client

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up portable MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      - name: Configure
        shell: msys2 {0}
        run: cmake -S client -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build client and launcher
        shell: msys2 {0}
        run: cmake --build build --config Release -- -j2

      - name: Compute client checksum
        id: checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash build/blubox_client.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Publish release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "build/blubox_client.exe" `
            "build/blubox_launcher.exe" `
            --repo "${{ github.repository }}" `
            --title "Blubox ${{ github.ref_name }}" `
            --notes "Client protocol v3: buffered jumping, per-session multiplayer identity, 3D player nameplates, and improved character lighting."

      - name: Publish matching launcher manifest
        uses: actions/github-script@v7
        env:
          CLIENT_SHA256: ${{ steps.checksum.outputs.sha256 }}
        with:
          script: |
            const version = context.ref.replace('refs/tags/v', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'version.json';
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            const manifest = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
            manifest.version = version;
            manifest.downloadUrl = `https://github.com/${owner}/${repo}/releases/download/v${version}/blubox_client.exe`;
            manifest.sha256 = process.env.CLIENT_SHA256;
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'main',
              message: `Publish Blubox client manifest v${version}`,
              sha: current.data.sha,
              content: Buffer.from(`${JSON.stringify(manifest, null, 2)}\n`).toString('base64'),
            });
