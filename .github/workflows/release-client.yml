name: Build and publish Blubox apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache

      - name: Set compiler cache location
        shell: pwsh
        run: |
          "CCACHE_DIR=$env:RUNNER_TEMP\blubox-ccache" >> $env:GITHUB_ENV
          "CCACHE_COMPILERCHECK=content" >> $env:GITHUB_ENV
          "CCACHE_MAXSIZE=5G" >> $env:GITHUB_ENV

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/blubox-ccache
          key: ${{ runner.os }}-ucrt64-ccache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ucrt64-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-ucrt64-ccache-v
            ${{ runner.os }}-ucrt64-ccache-

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Configure Client
        shell: msys2 {0}
        run: cmake -S client -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure Studio
        shell: msys2 {0}
        run: cmake -S studio-source -B studio-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build apps and installers
        id: build
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./studio-source/tools/release/Build-Release.ps1 -ClientRoot ./client -ClientBuildDir ./build -StudioRoot ./studio-source -StudioBuildDir ./studio-build -AppVersion $version -BuildParallelism 4
          $studioProject = Get-Content './studio-source/CMakeLists.txt' -Raw
          if ($studioProject -notmatch 'project\(BluboxStudio VERSION ([0-9]+(?:\.[0-9]+){1,3})') { throw 'Studio version missing from studio-source/CMakeLists.txt.' }
          "studio_version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Verify Windows executables have no third-party DLL imports
        shell: msys2 {0}
        run: |
          set -euo pipefail
          for executable in \
            studio-source/dist/release_staging/BluboxClient.exe \
            studio-source/dist/release_staging/BluboxLauncher.exe \
            studio-source/dist/release_staging/BluboxStudioLauncher.exe \
            studio-source/dist/release_staging/BluboxStudio.exe; do
            if objdump -p "$executable" | grep -Eiq 'DLL Name: (lib.*\.dll|zlib.*\.dll)$'; then
              echo "Unexpected third-party DLL import in $executable" >&2
              objdump -p "$executable" | grep -Ei 'DLL Name: (lib.*\.dll|zlib.*\.dll)$' >&2
              exit 1
            fi
          done

      - name: Test combined installer install and uninstall
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $stage = 'studio-source/dist/release_staging'
          $installer = "studio-source/dist/Blubox-Setup-$version.exe"
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\Blubox'
          $legacyUninstallKeys = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{5F1E3447-4F5B-43CE-8E96-FA67BE6F17A1}_is1',
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{855A8507-8E44-4A19-9DB7-B33A43C01D44}_is1'
          )
          foreach ($key in $legacyUninstallKeys) {
            New-Item -Path $key -Force | Out-Null
            New-ItemProperty -Path $key -Name 'UninstallString' -Value 'legacy test entry' -PropertyType String -Force | Out-Null
          }
          foreach ($path in @("$installRoot/Client/unins000.exe", "$installRoot/Client/unins000.dat", "$installRoot/Studio/unins000.exe", "$installRoot/Studio/unins000.dat")) {
            New-Item -ItemType Directory -Path (Split-Path -Parent $path) -Force | Out-Null
            Set-Content -LiteralPath $path -Value 'legacy test uninstaller'
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Combined installer failed with exit code $($process.ExitCode)." }

          foreach ($key in $legacyUninstallKeys) {
            if (Test-Path -LiteralPath $key) { throw "Installer left an obsolete child uninstaller registered: $key." }
          }
          foreach ($path in @("$installRoot/Client/unins000.exe", "$installRoot/Client/unins000.dat", "$installRoot/Studio/unins000.exe", "$installRoot/Studio/unins000.dat")) {
            if (Test-Path -LiteralPath $path) { throw "Installer left an obsolete child uninstaller behind: $path." }
          }

          $installedFiles = @(
            @{ Staged = "$stage/BluboxClient.exe"; Installed = "$installRoot/Client/BluboxClient.exe" },
            @{ Staged = "$stage/BluboxClient-LICENSE.txt"; Installed = "$installRoot/Client/LICENSE.txt" },
            @{ Staged = "$stage/BluboxStudio.exe"; Installed = "$installRoot/Studio/BluboxStudio.exe" },
            @{ Staged = "$stage/BluboxStudio-LICENSE.txt"; Installed = "$installRoot/Studio/LICENSE.txt" },
            @{ Staged = "$stage/assets/editor/luau_api_catalog.json"; Installed = "$installRoot/Studio/assets/editor/luau_api_catalog.json" },
            @{ Staged = "$stage/assets/editor/fonts/InterVariable.ttf"; Installed = "$installRoot/Studio/assets/editor/fonts/InterVariable.ttf" },
            @{ Staged = "$stage/assets/editor/fonts/JetBrainsMonoRegular.ttf"; Installed = "$installRoot/Studio/assets/editor/fonts/JetBrainsMonoRegular.ttf" }
          )
          foreach ($file in $installedFiles) {
            if (-not (Test-Path -LiteralPath $file.Installed -PathType Leaf)) { throw "Installer did not install $($file.Installed)." }
            $stagedHash = (Get-FileHash -LiteralPath $file.Staged -Algorithm SHA256).Hash
            $installedHash = (Get-FileHash -LiteralPath $file.Installed -Algorithm SHA256).Hash
            if ($stagedHash -ne $installedHash) { throw "Installed file does not match staged file: $($file.Installed)." }
          }

          $protocolRegistrations = @(
            @{ Scheme = 'blubox'; Executable = "$installRoot\Client\BluboxClient.exe" },
            @{ Scheme = 'blubox-studio'; Executable = "$installRoot\Studio\BluboxStudio.exe" }
          )
          foreach ($registration in $protocolRegistrations) {
            $protocolKey = "HKCU:\Software\Classes\$($registration.Scheme)"
            $protocol = Get-Item -LiteralPath $protocolKey -ErrorAction Stop
            if ($protocol.GetValueNames() -notcontains 'URL Protocol' -or $protocol.GetValue('URL Protocol') -ne '') {
              throw "Installer did not mark $($registration.Scheme) as a URL protocol."
            }

            $commandKey = Join-Path $protocolKey 'shell\open\command'
            $command = (Get-Item -LiteralPath $commandKey -ErrorAction Stop).GetValue('')
            $expectedCommand = '"{0}" "%1"' -f $registration.Executable
            if ($command -ne $expectedCommand) {
              throw "Installer registered an invalid command for $($registration.Scheme): $command."
            }
          }
          foreach ($key in @('HKCU:\Software\Blubox\Legal\Client', 'HKCU:\Software\Blubox\Legal\Studio')) {
            if (-not (Test-Path -LiteralPath $key)) { throw "Installer did not record license acceptance: $key." }
          }

          $uninstaller = Join-Path $installRoot 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw 'Combined installer did not create its uninstaller.' }
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Combined uninstaller failed with exit code $($process.ExitCode)." }
          foreach ($path in @("$installRoot/Client/BluboxClient.exe", "$installRoot/Studio/BluboxStudio.exe")) {
            if (Test-Path -LiteralPath $path) { throw "Uninstaller left an app executable behind: $path." }
          }
          foreach ($key in @('HKCU:\Software\Classes\blubox', 'HKCU:\Software\Classes\blubox-studio')) {
            if (Test-Path -LiteralPath $key) { throw "Uninstaller left a protocol registered: $key." }
          }
          foreach ($key in @('HKCU:\Software\Blubox\Legal\Client', 'HKCU:\Software\Blubox\Legal\Studio')) {
            $acceptance = Get-ItemProperty -LiteralPath $key -Name 'AcceptedEulaVersion' -ErrorAction SilentlyContinue
            if ($null -ne $acceptance) { throw "Uninstaller left license records behind: $key." }
          }
          foreach ($path in @("$installRoot/Client", "$installRoot/Studio")) {
            if (Test-Path -LiteralPath $path) { throw "Uninstaller left an app installation directory behind: $path." }
          }

      - name: Show compiler cache statistics
        if: always()
        shell: msys2 {0}
        run: ccache --show-stats

      - name: Compute checksums
        id: checksums
        shell: pwsh
        run: |
          $stage = 'studio-source/dist/release_staging'
          $client = (Get-FileHash "$stage/BluboxClient.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $clientLauncher = (Get-FileHash "$stage/BluboxLauncher.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $studioLauncher = (Get-FileHash "$stage/BluboxStudioLauncher.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $studio = (Get-FileHash "$stage/BluboxStudio.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $font = (Get-FileHash "$stage/assets/editor/fonts/InterVariable.ttf" -Algorithm SHA256).Hash.ToLowerInvariant()
          $codeFont = (Get-FileHash "$stage/assets/editor/fonts/JetBrainsMonoRegular.ttf" -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $setup = (Get-FileHash "studio-source/dist/Blubox-Setup-$version.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "client=$client" >> $env:GITHUB_OUTPUT
          "client_launcher=$clientLauncher" >> $env:GITHUB_OUTPUT
          "studio_launcher=$studioLauncher" >> $env:GITHUB_OUTPUT
          "studio=$studio" >> $env:GITHUB_OUTPUT
          "font=$font" >> $env:GITHUB_OUTPUT
          "code_font=$codeFont" >> $env:GITHUB_OUTPUT
          "setup=$setup" >> $env:GITHUB_OUTPUT

      - name: Prepare canonical setup filename
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          Copy-Item "studio-source/dist/Blubox-Setup-$version.exe" "$env:RUNNER_TEMP/Blubox-Setup.exe" -Force

      - name: Publish runtime payloads and installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $runtimeTag = "runtime-v$version"
          gh release create $runtimeTag `
            'studio-source/dist/release_staging/BluboxClient.exe' `
            'studio-source/dist/release_staging/BluboxLauncher.exe' `
            'studio-source/dist/release_staging/BluboxStudioLauncher.exe' `
            'studio-source/dist/release_staging/BluboxStudio.exe' `
            'studio-source/dist/release_staging/assets/editor/fonts/InterVariable.ttf' `
            'studio-source/dist/release_staging/assets/editor/fonts/JetBrainsMonoRegular.ttf' `
            'client/assets/icons/ATTRIBUTION.txt' `
            --repo '${{ github.repository }}' `
            --title "Blubox runtime payloads v$version" `
            --notes 'Runtime files downloaded by the Blubox launchers.' `
            --target '${{ github.sha }}' `
            --prerelease
          gh release create "v$version" `
            "$env:RUNNER_TEMP/Blubox-Setup.exe" `
            --repo '${{ github.repository }}' `
            --title "Blubox v$version" `
            --notes 'Download Blubox Client and Studio with the unified installer.'

      - name: Publish updater manifest
        uses: actions/github-script@v8
        env:
          CLIENT_SHA256: ${{ steps.checksums.outputs.client }}
          CLIENT_LAUNCHER_SHA256: ${{ steps.checksums.outputs.client_launcher }}
          STUDIO_LAUNCHER_SHA256: ${{ steps.checksums.outputs.studio_launcher }}
          STUDIO_SHA256: ${{ steps.checksums.outputs.studio }}
          STUDIO_FONT_SHA256: ${{ steps.checksums.outputs.font }}
          STUDIO_CODE_FONT_SHA256: ${{ steps.checksums.outputs.code_font }}
          SETUP_SHA256: ${{ steps.checksums.outputs.setup }}
          STUDIO_VERSION: ${{ steps.build.outputs.studio_version }}
        with:
          script: |
            const version = context.ref.replace('refs/tags/v', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'version.json';
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            const manifest = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
            const runtimeTag = `runtime-v${version}`;
            manifest.version = version;
            manifest.downloadUrl = `https://github.com/${owner}/${repo}/releases/download/${runtimeTag}/BluboxClient.exe`;
            manifest.sha256 = process.env.CLIENT_SHA256;
            manifest.launcherVersion = version;
            manifest.launcherDownloadUrl = `https://github.com/${owner}/${repo}/releases/download/${runtimeTag}/BluboxLauncher.exe`;
            manifest.launcherSha256 = process.env.CLIENT_LAUNCHER_SHA256;
            manifest.studioLauncherVersion = version;
            manifest.studioLauncherDownloadUrl = `https://github.com/${owner}/${repo}/releases/download/${runtimeTag}/BluboxStudioLauncher.exe`;
            manifest.studioLauncherSha256 = process.env.STUDIO_LAUNCHER_SHA256;
            manifest.studioVersion = process.env.STUDIO_VERSION;
            manifest.studioDownloadUrl = `https://github.com/${owner}/${repo}/releases/download/${runtimeTag}/BluboxStudio.exe`;
            manifest.studioSha256 = process.env.STUDIO_SHA256;
            manifest.studioFontUrl = `https://github.com/${owner}/${repo}/releases/download/${runtimeTag}/InterVariable.ttf`;
            manifest.studioFontSha256 = process.env.STUDIO_FONT_SHA256;
            manifest.studioCodeFontUrl = `https://github.com/${owner}/${repo}/releases/download/${runtimeTag}/JetBrainsMonoRegular.ttf`;
            manifest.studioCodeFontSha256 = process.env.STUDIO_CODE_FONT_SHA256;
            manifest.setupDownloadUrl = `https://github.com/${owner}/${repo}/releases/download/v${version}/Blubox-Setup.exe`;
            manifest.setupSha256 = process.env.SETUP_SHA256;
            const content = Buffer.from(`${JSON.stringify(manifest, null, 2)}\n`).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', message: `Publish Blubox manifest v${version}`,
              sha: current.data.sha, content,
            });
            const studioPath = 'studio-version.json';
            const studioCurrent = await github.rest.repos.getContent({ owner, repo, path: studioPath, ref: 'main' });
            const studioManifest = {
              version: process.env.STUDIO_VERSION,
              downloadUrl: `https://github.com/${owner}/${repo}/releases/download/${runtimeTag}/BluboxStudio.exe`,
              sha256: process.env.STUDIO_SHA256,
            };
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: studioPath, branch: 'main',
              message: `Publish Blubox Studio manifest v${studioManifest.version}`,
              sha: studioCurrent.data.sha,
              content: Buffer.from(`${JSON.stringify(studioManifest, null, 2)}\n`).toString('base64'),
            });

  macos:
    runs-on: macos-15
    outputs:
      version: ${{ steps.package.outputs.version }}
      studio_version: ${{ steps.package.outputs.studio_version }}
      archive_sha256: ${{ steps.checksums.outputs.archive }}
      client_sha256: ${{ steps.checksums.outputs.client }}
      launcher_sha256: ${{ steps.checksums.outputs.launcher }}
      studio_sha256: ${{ steps.checksums.outputs.studio }}
      studio_launcher_sha256: ${{ steps.checksums.outputs.studio_launcher }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up compiler cache
        shell: bash
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi
          echo "CCACHE_DIR=$RUNNER_TEMP/blubox-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=5G" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/blubox-ccache
          key: macos-15-universal-ccache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            macos-15-universal-ccache-v
            macos-15-universal-ccache-

      - name: Create app icons
        shell: bash
        run: |
          mkdir -p build studio-build
          make_icon() {
            source="$1"
            output="$2"
            iconset="${output%.icns}.iconset"
            mkdir -p "$iconset"
            for size in 16 32 128 256 512 1024; do
              sips -z "$size" "$size" "$source" \
                --out "$iconset/icon_${size}x${size}.png" >/dev/null
            done
            for size in 16 32 128 256; do
              double_size=$((size * 2))
              sips -z "$double_size" "$double_size" "$source" \
                --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
            done
            mv "$iconset/icon_1024x1024.png" "$iconset/icon_512x512@2x.png"
            iconutil -c icns "$iconset" -o "$output"
          }
          make_icon client/assets/bloxity-icon.png build/AppIcon.icns
          make_icon studio-source/assets/branding/bloxity-icon.png studio-build/AppIcon.icns

      - name: Configure Client
        run: >-
          cmake -S client -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache
          -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache

      - name: Configure Studio
        run: >-
          cmake -S studio-source -B studio-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache
          -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache

      - name: Build macOS apps and runtime payloads
        run: |
          cmake --build build --parallel 3 --target blubox_client blubox_launcher blubox_studio_launcher
          cmake --build studio-build --parallel 3 --target blubox_studio

      - name: Ad-hoc sign macOS app bundles
        run: |
          codesign --force --deep --sign - "build/Blubox Client.app"
          codesign --force --deep --sign - "studio-build/Blubox Studio.app"
          codesign --verify --deep --strict --verbose=2 "build/Blubox Client.app"
          codesign --verify --deep --strict --verbose=2 "studio-build/Blubox Studio.app"

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Package combined app bundle
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          studio_version="$(sed -nE 's/^project\(BluboxStudio VERSION ([0-9]+(\.[0-9]+){1,3}).*/\1/p' studio-source/CMakeLists.txt)"
          if [[ -z "$studio_version" ]]; then
            echo "Studio version missing from studio-source/CMakeLists.txt." >&2
            exit 1
          fi
          assets="$RUNNER_TEMP/macos-release-assets"
          bundle_dir="$RUNNER_TEMP/Blubox for macOS"
          runtime_dir="$assets/runtime"
          mkdir -p "$bundle_dir" "$runtime_dir"
          ditto "build/Blubox Client.app" "$bundle_dir/Blubox Client.app"
          ditto "studio-build/Blubox Studio.app" "$bundle_dir/Blubox Studio.app"
          ditto -c -k --sequesterRsrc --keepParent "$bundle_dir" "$assets/Blubox-macOS-universal.zip"
          unzip -Z1 "$assets/Blubox-macOS-universal.zip" | grep -Fx "Blubox for macOS/Blubox Client.app/Contents/Info.plist"
          unzip -Z1 "$assets/Blubox-macOS-universal.zip" | grep -Fx "Blubox for macOS/Blubox Studio.app/Contents/Info.plist"
          cp "build/blubox_client" "$runtime_dir/BluboxClient-macOS-universal"
          cp "build/Blubox Client.app/Contents/MacOS/Blubox Client" "$runtime_dir/BluboxLauncher-macOS-universal"
          cp "studio-build/Blubox Studio.app/Contents/MacOS/Blubox Studio" "$runtime_dir/BluboxStudio-macOS-universal"
          cp "build/blubox_studio_launcher" "$runtime_dir/BluboxStudioLauncher-macOS-universal"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "studio_version=$studio_version" >> "$GITHUB_OUTPUT"

      - name: Compute runtime checksums
        id: checksums
        shell: bash
        run: |
          echo "archive=$(shasum -a 256 "$RUNNER_TEMP/macos-release-assets/Blubox-macOS-universal.zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          runtime="$RUNNER_TEMP/macos-release-assets/runtime"
          echo "client=$(shasum -a 256 "$runtime/BluboxClient-macOS-universal" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "launcher=$(shasum -a 256 "$runtime/BluboxLauncher-macOS-universal" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "studio=$(shasum -a 256 "$runtime/BluboxStudio-macOS-universal" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "studio_launcher=$(shasum -a 256 "$runtime/BluboxStudioLauncher-macOS-universal" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: ${{ runner.temp }}/macos-release-assets/
          compression-level: 0

  publish-macos:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS release assets
        uses: actions/download-artifact@v4
        with:
          name: macos-release-assets
          path: ${{ runner.temp }}/macos-release-assets

      - name: Publish macOS app bundle and runtime payloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "v$version" \
            "$RUNNER_TEMP/macos-release-assets/Blubox-macOS-universal.zip" \
            --repo "${{ github.repository }}" \
            --clobber
          gh release upload "runtime-v$version" \
            "$RUNNER_TEMP/macos-release-assets/runtime/BluboxClient-macOS-universal" \
            "$RUNNER_TEMP/macos-release-assets/runtime/BluboxLauncher-macOS-universal" \
            "$RUNNER_TEMP/macos-release-assets/runtime/BluboxStudio-macOS-universal" \
            "$RUNNER_TEMP/macos-release-assets/runtime/BluboxStudioLauncher-macOS-universal" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Publish macOS updater manifests
        uses: actions/github-script@v8
        env:
          ARCHIVE_SHA256: ${{ needs.macos.outputs.archive_sha256 }}
          CLIENT_SHA256: ${{ needs.macos.outputs.client_sha256 }}
          CLIENT_LAUNCHER_SHA256: ${{ needs.macos.outputs.launcher_sha256 }}
          STUDIO_SHA256: ${{ needs.macos.outputs.studio_sha256 }}
          STUDIO_LAUNCHER_SHA256: ${{ needs.macos.outputs.studio_launcher_sha256 }}
          STUDIO_VERSION: ${{ needs.macos.outputs.studio_version }}
        with:
          script: |
            const version = context.ref.replace('refs/tags/v', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runtimeTag = `runtime-v${version}`;
            const current = await github.rest.repos.getContent({
              owner, repo, path: 'version.json', ref: 'main',
            });
            const manifest = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
            manifest.platforms ??= {};
            manifest.platforms.macos = {
              archiveDownloadUrl: `https://github.com/${owner}/${repo}/releases/download/v${version}/Blubox-macOS-universal.zip`,
